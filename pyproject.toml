[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bigran-ir"
version = "0.1.0"
description = "BiGran-IR: dual-granularity (17 functional groups + 72 bond vibrations) prediction from IR spectra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]